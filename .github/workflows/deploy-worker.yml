name: Deploy club Worker (Crotts + auth + D1)

# Deploys auth-worker/ to Cloudflare and syncs its runtime secrets from GitHub Secrets.
# The OpenRouter key is stored ONLY as an encrypted GitHub Secret and injected into the
# Cloudflare Worker's secret store at deploy time — it is never committed to the repo and
# never reaches the browser (the Worker proxies all AI calls server-side).
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare token with "Edit Cloudflare Workers" (covers Workers AI, D1, KV)
#   JWT_SECRET            - member-auth signing secret (>= 32 chars)
#   OPENROUTER_API_KEY    - OpenRouter key for Crotts' primary brain (free key at openrouter.ai);
#                           if omitted, Crotts falls back to Cloudflare Workers AI.
#
# Before the first deploy, fill the real KV/D1 ids in auth-worker/wrangler.toml
# (the REPLACE_WITH_* placeholders) so wrangler can bind them.

on:
  push:
    branches: [main]
    paths: ["auth-worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy runs ONLY when production is configured (the CLOUDFLARE_API_TOKEN repo secret is set).
    # Until then this is a CI gate — it type-checks + tests on every push to main and SKIPS the deploy,
    # so an un-provisioned production no longer shows a red X on main.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler 4.x requires Node >= 22
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json
      - name: Static site tests
        run: npm test
      - name: Install dependencies
        working-directory: auth-worker
        run: npm ci
      - name: Type-check + tests (gate the deploy)
        working-directory: auth-worker
        run: |
          npm run typegen:check
          npm run audit
          npm run typecheck
          npm test
          # Placeholder resource ids are expected until production is provisioned; the strict no-placeholder
          # check below guards the real deploy.
          node scripts/validate-wrangler-config.mjs --allow-placeholders
      - name: Check production resource config
        id: prod_config
        working-directory: auth-worker
        run: |
          if node scripts/validate-wrangler-config.mjs; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production Cloudflare resource ids are still placeholders; tests passed and deploy is skipped."
          fi
      - name: Deploy to Cloudflare + sync secrets
        if: ${{ env.HAS_CF_TOKEN == 'true' && steps.prod_config.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: auth-worker
          # wrangler-action runs `wrangler secret put` for each name using the matching env var below.
          secrets: |
            JWT_SECRET
            GEMINI_API_KEY
            OPENROUTER_API_KEY
            PAYPAL_CLIENT_ID
            PAYPAL_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PayPal Checkout — optional. Add both to turn payments on; omit to keep the manual paid flag.
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
