<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
        
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            position: relative;
            font-family: 'Archivo', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)),
                url("img/bg/forest-bg.png");
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: cover;
            opacity: 1;
        }

        [data-theme="dark"] body::before {
            background:
                linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)),
                url("img/bg/forest-bg.png");
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: cover;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        [data-theme="dark"] header {
            background: rgba(15, 15, 30, 0.95);
        }
        
        header.scrolled {
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            padding: 0.75rem 1.5rem;
        }
        
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: white;
            letter-spacing: 0.05em;
            text-decoration: none;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .logo-image {
            height: 50px;
            width: auto;
            transition: transform 0.3s ease;
        }
        
        header.scrolled .logo-image {
            height: 40px;
        }
        
        .logo:active {
            transform: scale(0.95);
        }
        
        .logo:hover .logo-image {
            transform: scale(1.05);
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle svg,
        .menu-toggle svg {
            display: block;
            pointer-events: none;
        }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(20deg) scale(1.1);
        }
        
        .theme-toggle:active {
            transform: rotate(20deg) scale(0.95);
        }
        
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after,
        .nav-links a:active::after,
        .nav-links a.active::after {
            width: 100%;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .nav-links a[aria-current="page"] {
            text-decoration: underline;
            text-underline-offset: 5px;
            font-weight: 800;
        }

        .nav-links a.nav-donate {
            background: var(--accent);
            color: var(--secondary) !important;
            padding: 0.35rem 0.95rem;
            border-radius: 999px;
            font-weight: 800;
        }

        .nav-links a.nav-donate:hover {
            color: var(--secondary);
            filter: brightness(1.08);
        }
        
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            min-width: 44px;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease;
        }
        
        .menu-toggle:active {
            transform: scale(0.9);
        }
        
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }
            
            .logo-image {
                height: 40px;
            }
            
            header.scrolled .logo-image {
                height: 35px;
            }
            
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .nav-right {
                gap: 1rem;
            }
            
            .nav-links {
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(26, 26, 46, 0.98);
                flex-direction: column;
                gap: 0;
                padding: 2rem;
                transform: translateY(-100%);
                opacity: 0;
                transition: all 0.3s ease;
                pointer-events: none;
                max-height: calc(100vh - 70px);
                overflow-y: auto;
            }
            
            [data-theme="dark"] .nav-links {
                background: rgba(15, 15, 30, 0.98);
            }
            
            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: all;
            }
            
            .nav-links li {
                padding: 1.25rem 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .nav-links li:last-child {
                border-bottom: none;
            }
            
            .nav-links a {
                font-size: 1.1rem;
                display: block;
                padding: 0.5rem 0;
            }
        }
        
        /* Page Hero */
        .page-hero {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--green) 100%);
            padding: 8rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .page-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px);
        }
        
        .page-hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: white;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        
        .page-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Under Construction Section ── */
        .construction-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .construction-card {
            max-width: 640px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 3.5rem 3rem;
            text-align: center;
            box-shadow: 0 15px 50px var(--card-shadow);
            border: 1px solid rgba(0, 78, 137, 0.08);
            position: relative;
            overflow: hidden;
            animation: cardIn 0.7s ease forwards;
        }

        [data-theme="dark"] .construction-card {
            border-color: rgba(255, 255, 255, 0.05);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Animated disc icon */
        .disc-icon {
            color: var(--primary);
            display: inline-block;
            animation: discSpin 4s ease-in-out infinite;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        .disc-icon svg {
            display: block;
            width: 4.5rem;
            height: 4.5rem;
        }

        @keyframes discSpin {
            0%   { transform: rotate(0deg) scale(1); }
            25%  { transform: rotate(15deg) scale(1.05); }
            50%  { transform: rotate(0deg) scale(1); }
            75%  { transform: rotate(-15deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .construction-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            color: var(--text-primary);
            letter-spacing: 0.04em;
            margin-bottom: 0.75rem;
            line-height: 1.15;
        }

        .construction-heading span {
            color: var(--primary);
        }

        .construction-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-tertiary);
            margin-bottom: 2rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Progress bar */
        .progress-wrap {
            max-width: 360px;
            margin: 0 auto 2.25rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .progress-track {
            height: 10px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            animation: fillBar 1.6s 0.5s ease forwards;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
            animation: shimmer 2s 2.2s ease-in-out infinite;
        }

        @keyframes fillBar {
            to { width: 30%; }
        }

        @keyframes shimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--primary-strong);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.9rem 2rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #ff7f4d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.35);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover svg {
            transform: translateX(-3px);
        }

        @media (max-width: 520px) {
            .construction-card {
                padding: 2.5rem 1.5rem;
            }
        }

        /* Footer */
        footer {
            background: linear-gradient(135deg, var(--dark) 0%, #0d1a0d 100%);
            color: white;
            text-align: center;
            padding: 2.5rem 2rem;
            font-size: 0.95rem;
            border-top: 3px solid var(--accent);
        }
        
        [data-theme="dark"] footer {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #0a0a14 100%);
        }

        @media (max-width: 768px) {
            body[data-page="gvdg-blog"] #crottsReactApp #crotts-fab,
            body[data-page="gvdg-blog"] #crottsReactApp #crotts-panel {
                display: none !important;
            }
        }
    </style>
  <script type="module" src="public-app/public-app.js"></script>
  <script src="pwa.js" defer></script>
</head>
<body data-page="gvdg-blog">
    <div id="publicReactPageChrome"></div>

    <div id="blogReactApp"></div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Greenville Disc Golf Club. All rights reserved.</p>
    </footer>

    <div id="crottsReactApp"></div>
</body>
</html>
