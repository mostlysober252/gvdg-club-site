    <style>
        /* Design tokens (color / surfaces / text) live in tokens.css, linked above — one source of truth. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
body{ position: relative; }

  content: ""; position: fixed; inset: 0; z-index: -1;

}
[data-theme="dark"] body::before {
  background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
  background-repeat: no-repeat; background-position: center bottom; background-size: cover;
}
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }

        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: white; letter-spacing: 0.05em; text-decoration: none; transition: transform 0.3s ease; display: flex; align-items: center; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .logo:active { transform: scale(0.95); }
        .logo:hover .logo-image { transform: scale(1.05); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .theme-toggle { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); color: white; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        .theme-toggle svg { display: block; width: 22px; height: 22px; min-width: 22px; flex: 0 0 22px; pointer-events: none; }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(20deg) scale(1.1); }
        .theme-toggle:active { transform: rotate(20deg) scale(0.95); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after, .nav-links a:active::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a[aria-current="page"] { text-decoration: underline; text-underline-offset: 5px; font-weight: 800; }
        .nav-links a.nav-donate { background: var(--accent); color: var(--secondary) !important; padding: 0.35rem 0.95rem; border-radius: 999px; font-weight: 800; }
        .nav-links a.nav-donate:hover { color: var(--secondary); filter: brightness(1.08); }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform 0.2s ease; }
        .menu-toggle:active { transform: scale(0.9); }
        @media (max-width: 768px) {

            .logo-image { height: 40px; }
            header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .nav-right { gap: 1rem; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none; max-height: calc(100vh - 70px); overflow-y: auto; }
            [data-theme="dark"] .nav-links { background: rgba(15, 15, 30, 0.98); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1.25rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .nav-links li:last-child { border-bottom: none; }
            .nav-links a { font-size: 1.1rem; display: block; padding: 0.5rem 0; }
        }
        .hero { position: relative; height: 100vh; min-height: 600px; display: flex; align-items: center; justify-content: center; background: var(--dark); overflow: hidden; }
        .hero-bg-pattern { display: none; }
        @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(70px); } }
        .carousel { position: absolute; inset: 0; width: 100%; height: 100%; }
        .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; background-size: cover; background-position: center; }
        .carousel-slide.active { opacity: 1; }
        .carousel-slide::after { content: ''; position: absolute; inset: 0; background: transparent; }
        .carousel-slide:nth-child(1) { background-image: url('img/slide1.jpg'); }
        .carousel-slide:nth-child(2) { background-image: url('img/slide2.jpg'); }
        .carousel-slide:nth-child(3) { background-image: url('img/slide3.jpg'); }
        .carousel-slide:nth-child(4) { background-image: url('img/slide4.jpg'); }
        .carousel-slide:nth-child(5) { background-image: url('img/slide5.jpg'); }
        .carousel-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; padding: 1rem; }
.carousel-controls { position: absolute !important; bottom: 30px !important; left: 50% !important; transform: translateX(-50%) !important; display: flex !important; justify-content: center !important; align-items: center !important; gap: 16px !important; z-index: 10 !important; padding: 10px !important; width: auto !important; }
.carousel-dot { width: 12px !important; height: 12px !important; min-width: 12px !important; min-height: 12px !important; max-width: 12px !important; max-height: 12px !important; padding: 0 !important; box-sizing: border-box !important; background-clip: border-box !important; border-radius: 50% !important; background: rgba(255, 255, 255, 0.4) !important; border: 2px solid rgba(255, 255, 255, 0.8) !important; cursor: pointer !important; transition: all 0.3s ease !important; -webkit-tap-highlight-color: transparent !important; position: relative !important; flex-shrink: 0 !important; flex-grow: 0 !important; }
.carousel-dot::before { content: '' !important; position: absolute !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 44px !important; height: 44px !important; background: transparent !important; border: none !important; border-radius: 50% !important; pointer-events: none !important; }
.carousel-dot.active { background: white !important; border-color: white !important; transform: scale(1.3) !important; width: 12px !important; height: 12px !important; }
.carousel-dot:hover { background: rgba(255, 255, 255, 0.8) !important; border-color: white !important; }
@media (max-width: 768px) { .carousel-controls { bottom: 25px !important; gap: 14px !important; } .carousel-dot { width: 10px !important; height: 10px !important; min-width: 10px !important; min-height: 10px !important; max-width: 10px !important; max-height: 10px !important; } .carousel-dot.active { width: 10px !important; height: 10px !important; transform: scale(1.4) !important; } }
@media (max-width: 480px) { .carousel-controls { bottom: 20px !important; gap: 12px !important; } .carousel-dot { width: 8px !important; height: 8px !important; min-width: 8px !important; min-height: 8px !important; max-width: 8px !important; max-height: 8px !important; } .carousel-dot.active { width: 8px !important; height: 8px !important; transform: scale(1.5) !important; } }
.carousel-indicators .carousel-indicator, .about-carousel-nav .carousel-indicator, .courses-carousel-nav .carousel-indicator { width: 12px !important; height: 12px !important; min-width: 12px !important; min-height: 12px !important; max-width: 12px !important; max-height: 12px !important; padding: 0 !important; border-radius: 50% !important; background: var(--text-muted) !important; border: none !important; cursor: pointer !important; opacity: 0.4 !important; transition: all 0.3s ease !important; flex-shrink: 0 !important; position: relative !important; }
.carousel-indicators .carousel-indicator::before, .about-carousel-nav .carousel-indicator::before, .courses-carousel-nav .carousel-indicator::before { content: '' !important; position: absolute !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 44px !important; height: 44px !important; background: transparent !important; pointer-events: none !important; }
.carousel-indicators .carousel-indicator.active, .about-carousel-nav .carousel-indicator.active, .courses-carousel-nav .carousel-indicator.active { background: var(--primary) !important; opacity: 1 !important; transform: scale(1.3) !important; }
        .carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white; width: 50px; height: 50px; min-width: 50px; min-height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; transition: all 0.3s ease; backdrop-filter: blur(5px); z-index: 10; -webkit-tap-highlight-color: transparent; }
        .carousel-arrow:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-50%) scale(1.1); }
        .carousel-arrow:active { transform: translateY(-50%) scale(0.95); }
        .carousel-prev { left: 20px; }
        .carousel-next { right: 20px; }
        @media (max-width: 768px) { .carousel-arrow { top: 68%; width: 44px; height: 44px; min-width: 44px; min-height: 44px; font-size: 1.2rem; } .carousel-prev { left: 10px; } .carousel-next { right: 10px; } .carousel-controls { bottom: 20px; } }
        .hero-content { position: relative; z-index: 5; text-align: center; color: white; max-width: 900px; padding: 0 2rem; animation: fadeInUp 1s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: 0.05em; margin-bottom: 1rem; text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.5); line-height: 1.1; }
        .hero-subtitle { font-size: clamp(1.1rem, 3vw, 1.5rem); margin-bottom: 2rem; opacity: 0.95; font-weight: 400; text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.5); }
        .cta-button { display: inline-block; background: var(--primary-strong); color: white; padding: 1rem 2.5rem; min-height: 44px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(200, 65, 15, 0.4); -webkit-tap-highlight-color: transparent; }
        .cta-button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(200, 65, 15, 0.5); background: #a83809; }
        .cta-button:active { transform: translateY(-1px); }
        .scroll-indicator { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 10; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-10px); } 60% { transform: translateX(-50%) translateY(-5px); } }
        .scroll-indicator::after { content: '↓'; display: block; color: white; font-size: 2rem; opacity: 0.7; }
        @media (max-width: 768px) { .hero { min-height: 500px; } .scroll-indicator { bottom: 100px; } }
        section { padding: clamp(3rem, 8vw, 6rem) 2rem; max-width: 1200px; margin: 0 auto; }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); text-align: center; margin-bottom: 3rem; letter-spacing: 0.05em; color: var(--text-primary); opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
        .section-title.visible { opacity: 1; transform: translateY(0); }
        #about { background: var(--bg-secondary); border-radius: 20px; margin: 2rem auto; padding: clamp(2rem, 6vw, 4rem); box-shadow: 0 10px 40px var(--card-shadow); max-width: calc(1200px - 4rem); border: 1px solid rgba(0, 78, 137, 0.08); }
        [data-theme="dark"] #about { border-color: rgba(255, 255, 255, 0.05); }
        .about-content { display: block; }
        .about-text { font-size: clamp(1rem, 2vw, 1.1rem); line-height: 1.8; color: var(--text-secondary); }
        .about-text p { margin-bottom: 1.5rem; }
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 2rem; }
        @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 2rem; border-radius: 15px; text-align: center; color: white; transition: all 0.3s ease; cursor: pointer; min-height: 120px; display: flex; flex-direction: column; justify-content: center; -webkit-tap-highlight-color: transparent; }
        .stat-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3); }
        .stat-card:active { transform: translateY(-2px) scale(1); }
        .stat-number { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 5vw, 3.5rem); line-height: 1; margin-bottom: 0.5rem; }
        .stat-label { font-size: clamp(0.9rem, 2vw, 1rem); opacity: 0.95; text-transform: uppercase; letter-spacing: 0.05em; }
        .about-carousel-container { position: relative; overflow: hidden; border-radius: 15px; }
        .about-carousel { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; }
        .carousel-slide-about { min-width: 100%; width: 100%; padding: 2rem 0; flex-shrink: 0; box-sizing: border-box; }
        .carousel-slide-about .about-content { display: grid; grid-template-columns: 1fr; gap: 3rem; align-items: center; width: 100%; }
        @media (min-width: 768px) { .carousel-slide-about .about-content { grid-template-columns: 1fr 1fr; } }
        .about-carousel-nav { display: flex; justify-content: center; align-items: center; gap: 2rem; margin-top: 2.5rem; }
        .board-members-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        @media (min-width: 768px) { .board-members-grid { grid-template-columns: repeat(3, 1fr); } }
        .board-member-card { background: linear-gradient(135deg, var(--green), var(--secondary)); padding: 1.5rem; border-radius: 15px; text-align: center; color: white; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
        .board-member-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(45, 80, 22, 0.4); }
        .board-member-icon { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .board-member-icon svg { width: 1em; height: 1em; }
        .board-member-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.02em; }
        .board-member-role { font-size: 0.85rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(255, 255, 255, 0.15); padding: 0.4rem 0.8rem; border-radius: 20px; }
        .board-member-card.founder .board-member-icon { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .board-member-card.founder { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .board-slide-header { text-align: center; margin-bottom: 2rem; }
        .board-slide-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.8rem, 4vw, 2.5rem); color: var(--primary); margin-bottom: 0.5rem; }
        .board-slide-subtitle { font-size: 1rem; color: var(--text-tertiary); font-weight: 600; }

        /* ===== COURSES SECTION (FIXED - reduced negative space) ===== */
        #courses {
            background: var(--bg-secondary);
            border-radius: 20px;
            margin: 2rem auto;
            padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 2vw, 1.5rem);
            max-width: calc(1200px - 4rem);
            border: 1px solid rgba(0, 78, 137, 0.08);
        }
        [data-theme="dark"] #courses { border-color: rgba(255, 255, 255, 0.05); }
        .courses-carousel-container { position: relative; overflow: hidden; border-radius: 15px; transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .courses-carousel { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); align-items: flex-start; }
        .carousel-slide-courses {
            min-width: 100%;
            padding: 0.5rem 0 0 0;
            flex-shrink: 0;
        }
        .slide-header { text-align: center; margin-bottom: 2.5rem; }
        .slide-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem, 5vw, 2.8rem); color: var(--primary); margin-bottom: 0.5rem; }
        .slide-subtitle { font-size: 1rem; color: var(--text-tertiary); font-weight: 600; }
        .courses-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        @media (max-width: 640px) { .courses-grid { grid-template-columns: 1fr; } }
        .course-card { background: var(--bg-primary); border-radius: 15px; overflow: hidden; border: 2px solid var(--border-color); transition: all 0.3s ease; display: block; outline: none; }
        .course-card[data-course] { cursor: pointer; }
        .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--card-shadow-hover); border-color: var(--primary); }
        .course-card:focus-visible { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.22), 0 10px 30px var(--card-shadow-hover); }
        .course-image { width: 100%; height: 180px; background: linear-gradient(135deg, var(--secondary), var(--green)); position: relative; overflow: hidden; }
        .course-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .course-card:hover .course-image img { transform: scale(1.05); }
        .course-image.no-image::before { content: none; }
        .course-placeholder-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.45); }
        .course-content { padding: 1.5rem; }
        .course-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
        .course-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--text-primary); flex: 1; }
        .difficulty-badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        .difficulty-beginner { background: linear-gradient(135deg, var(--green), #4a7c23); color: white; }
        .difficulty-intermediate { background: linear-gradient(135deg, var(--accent), #e5a600); color: var(--dark); }
        .difficulty-advanced { background: linear-gradient(135deg, var(--primary), #cc4a1a); color: white; }
        .course-location { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.35rem; }
        .course-location svg { flex: 0 0 auto; }
        .course-info { display: flex; gap: 1.5rem; margin: 1.5rem 0; padding: 1rem; background: var(--bg-tertiary); border-radius: 10px; }
        .info-item { flex: 1; text-align: center; }
        .info-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.3rem; }
        .info-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--primary); }
        .course-description { font-size: 0.95rem; line-height: 1.6; color: var(--text-tertiary); }
        .courses-carousel-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 1.25rem;
        }
        .carousel-btn { background: var(--primary-strong); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; padding: 0 !important; }
        .carousel-btn:hover { background: var(--secondary); transform: scale(1.1); }
        .carousel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .carousel-indicators { display: flex; gap: 0.8rem; align-items: center; }
        .carousel-indicator { width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); border: none; cursor: pointer; opacity: 0.4; transition: all 0.3s ease; }
        .carousel-indicator.active { background: var(--primary); opacity: 1; transform: scale(1.3); }

        .course-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 11000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 1rem; }
        .course-modal-overlay.active { opacity: 1; visibility: visible; }
        .course-modal { background: var(--bg-secondary); border-radius: 20px; max-width: 400px; width: 100%; padding: 2rem; transform: scale(0.9) translateY(20px); transition: all 0.3s ease; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        .course-modal-overlay.active .course-modal { transform: scale(1) translateY(0); }
