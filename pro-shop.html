<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Shop | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Archivo', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; flex-direction: column; }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(244,244,249,0.24), rgba(244,244,249,0.12)), url("img/bg/forest-bg.png") center bottom / cover no-repeat; }
        [data-theme="dark"] body::before { background: linear-gradient(to bottom, rgba(15,15,30,0.28), rgba(15,15,30,0.16)), url("img/bg/forest-bg.png") center bottom / cover no-repeat; }
        header { position: fixed; inset: 0 0 auto; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }
        header.scrolled { padding: 0.75rem 1.5rem; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        nav { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease, height 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .nav-right { display: flex; align-items: center; gap: 1.25rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; }
        .nav-links a::after { content: ""; position: absolute; left: 0; bottom: -5px; width: 0; height: 2px; background: var(--primary); transition: width 0.2s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .nav-links a[aria-current="page"] { text-decoration: underline; text-underline-offset: 5px; font-weight: 800; }
        .nav-links a.nav-donate { background: var(--accent); color: var(--secondary) !important; padding: 0.35rem 0.95rem; border-radius: 999px; font-weight: 800; }
        .nav-links a.nav-donate:hover { color: var(--secondary); filter: brightness(1.08); }
        .theme-toggle, .menu-toggle { min-width: 44px; min-height: 44px; border: 2px solid rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.1); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .theme-toggle svg, .menu-toggle svg { display: block; pointer-events: none; }
        .menu-toggle { display: none; border: none; background: transparent; font-size: 1.5rem; }
        main { width: min(1200px, 100%); margin: 0 auto; padding: 118px 1.5rem 4rem; flex: 1; }
        .shop-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 1.25rem; align-items: end; margin: 1rem 0 1.25rem; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 7vw, 4.2rem); letter-spacing: 0.05em; line-height: 1; color: var(--text-primary); text-shadow: 0 1px 3px rgba(255,255,255,0.55); }
        [data-theme="dark"] .page-title { text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
        .page-subtitle { color: var(--text-secondary); max-width: 56ch; line-height: 1.5; margin-top: 0.35rem; }
        .wallet-panel { background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 10px; padding: 1rem; box-shadow: 0 8px 28px var(--card-shadow); }
        .wallet-label { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        .wallet-balance { font-family: 'Bebas Neue', sans-serif; color: var(--primary); font-size: 2.4rem; line-height: 1; margin: 0.2rem 0; letter-spacing: 0.03em; }
        .wallet-note { color: var(--text-muted); font-size: 0.85rem; line-height: 1.45; }
        .wallet-panel a { color: var(--secondary-text); font-weight: 700; }
        .my-orders-panel { margin-bottom: 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem 1.1rem; }
        .my-orders-title { font-size: 1.05rem; margin-bottom: 0.6rem; color: var(--text-primary); }
        .my-orders-list { display: grid; gap: 0.6rem; }
        .my-order { border: 1px solid var(--border-color); border-radius: 8px; padding: 0.6rem 0.75rem; background: var(--bg-primary); }
        .my-order-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
        .my-order-status { font-weight: 700; font-size: 0.78rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); }
        .my-order-status.status-shipped, .my-order-status.status-completed { background: rgba(40,167,69,0.16); color: var(--green); }
        .my-order-status.status-cancelled { background: rgba(220,53,69,0.16); color: #dc3545; }
        .my-order-meta { color: var(--text-muted); font-size: 0.82rem; margin: 0.25rem 0; }
        .my-order-item { color: var(--text-secondary); font-size: 0.88rem; }
        .my-order-tracking { margin-top: 0.4rem; font-size: 0.88rem; }
        .my-order-tracking a { color: var(--secondary-text); font-weight: 700; }
        .shop-shell { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.25rem; align-items: start; }
        .filters { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; display: grid; grid-template-columns: minmax(180px, 1fr) repeat(4, minmax(120px, 160px)); gap: 0.75rem; }
        .filters input, .filters select { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); padding: 0.65rem 0.75rem; font: inherit; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .product-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px var(--card-shadow); transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 30px var(--card-shadow-hover); }
        .product-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--bg-tertiary); border-bottom: 1px solid var(--border-color); }
        .product-fallback { width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--secondary), var(--green)); color: white; font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.05em; }
        .product-body { padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }
        .product-name { font-weight: 800; color: var(--text-primary); line-height: 1.2; }
        .product-meta { color: var(--text-muted); font-size: 0.8rem; line-height: 1.35; }
        .product-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding-top: 0.5rem; }
        .product-price { font-family: 'Bebas Neue', sans-serif; color: var(--secondary-text); font-size: 1.6rem; letter-spacing: 0.03em; }
        .shop-btn { border: none; border-radius: 8px; background: var(--primary-strong); color: #fff; font-weight: 800; padding: 0.6rem 0.8rem; cursor: pointer; min-height: 40px; }
        .shop-btn.secondary { background: transparent; border: 1px solid var(--secondary-text); color: var(--secondary-text); }
        .shop-btn:disabled { opacity: 0.55; cursor: default; }
        .cart { position: sticky; top: 96px; background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 10px; padding: 1rem; box-shadow: 0 8px 28px var(--card-shadow); }
        .cart h2 { font-family: 'Bebas Neue', sans-serif; color: var(--primary); letter-spacing: 0.04em; font-size: 1.7rem; margin-bottom: 0.75rem; }
        .cart-list { display: grid; gap: 0.65rem; margin-bottom: 0.85rem; }
        .cart-row { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.55rem; }
        .cart-name { font-weight: 700; color: var(--text-primary); }
        .cart-meta { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.15rem; }
        .cart-actions { display: flex; align-items: center; gap: 0.35rem; }
        .cart-actions button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; }
        .cart-total { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-primary); font-weight: 800; margin: 0.7rem 0; }
        .cart-total span:last-child { font-family: 'Bebas Neue', sans-serif; color: var(--secondary-text); font-size: 1.7rem; }
        .payment-divider { display: none; align-items: center; gap: 0.6rem; color: var(--text-muted); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin: 0.75rem 0; }
        .payment-divider::before, .payment-divider::after { content: ""; height: 1px; background: var(--border-color); flex: 1; }
        .paypal-fields { display: grid; gap: 0.5rem; margin-bottom: 0.6rem; }
        .paypal-fields input { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); padding: 0.55rem 0.7rem; font: inherit; }
        .paypal-wrap { display: none; min-height: 44px; }
        .shop-status { min-height: 1.25rem; color: var(--text-muted); font-size: 0.88rem; line-height: 1.4; margin-top: 0.65rem; }
        .shop-status.error { color: #dc3545; font-weight: 700; }
        .shop-status.success { color: var(--green); font-weight: 700; }
        footer { background: linear-gradient(135deg, var(--dark), #0d1a0d); color: white; text-align: center; padding: 2.25rem 1rem; border-top: 3px solid var(--accent); }
        @media (max-width: 900px) { .shop-head, .shop-shell { grid-template-columns: 1fr; } .cart { position: static; } .filters { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) {
            header { padding: 1rem; } .logo-image { height: 40px; } header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; } .nav-right { gap: 0.75rem; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26,26,46,0.995); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; pointer-events: none; transition: all 0.3s ease; }
            [data-theme="dark"] .nav-links { background: rgba(15,15,30,0.995); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .filters { grid-template-columns: 1fr; }
            body[data-page="pro-shop"] #crotts-fab { bottom: calc(14px + env(safe-area-inset-bottom,0px)); }
            body[data-page="pro-shop"] #crotts-panel { bottom: calc(82px + env(safe-area-inset-bottom,0px)); }
        }
    </style>
  <script type="module" src="public-app/public-app.js"></script>
  <script src="pwa.js" defer></script>
</head>
<body data-auth-base="" data-page="pro-shop">
    <div id="publicReactPageChrome"></div>
    <div id="proShopReactApp"></div>
    <div id="crottsReactApp"></div>
    <footer><p>&copy; 2026 Greenville Disc Golf Club. All rights reserved. | Greenville, NC</p></footer>
</body>
</html>
