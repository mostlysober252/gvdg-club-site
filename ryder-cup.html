<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryder Cup | Greenville Disc Golf Club</title>
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(244,244,249,0.25), rgba(244,244,249,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover; opacity: 1;
        }
        [data-theme="dark"] body::before {
            background: linear-gradient(to bottom, rgba(15,15,30,0.25), rgba(15,15,30,0.15)), url("img/bg/forest-bg.png");
            background-repeat: no-repeat; background-position: center bottom; background-size: cover;
        }

        /* ---- Header / nav (mirrors index.html) ---- */
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); padding: 1rem 1.5rem; transition: all 0.3s ease; }
        [data-theme="dark"] header { background: rgba(15, 15, 30, 0.95); }
        header.scrolled { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2); padding: 0.75rem 1.5rem; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: white; letter-spacing: 0.05em; text-decoration: none; transition: transform 0.3s ease; display: flex; align-items: center; }
        .logo-image { height: 50px; width: auto; transition: transform 0.3s ease; }
        header.scrolled .logo-image { height: 40px; }
        .logo:active { transform: scale(0.95); }
        .logo:hover .logo-image { transform: scale(1.05); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .theme-toggle { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); color: white; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        .theme-toggle svg, .menu-toggle svg { display: block; pointer-events: none; }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(20deg) scale(1.1); }
        .theme-toggle:active { transform: rotate(20deg) scale(0.95); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; position: relative; transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after, .nav-links a:active::after { width: 100%; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a[aria-current="page"] { text-decoration: underline; text-underline-offset: 5px; font-weight: 800; }
        .nav-links a.nav-donate { background: var(--accent); color: var(--secondary) !important; padding: 0.35rem 0.95rem; border-radius: 999px; font-weight: 800; }
        .nav-links a.nav-donate:hover { color: var(--secondary); filter: brightness(1.08); }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: transform 0.2s ease; }
        .menu-toggle:active { transform: scale(0.9); }
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .logo-image { height: 40px; }
            header.scrolled .logo-image { height: 35px; }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .nav-right { gap: 1rem; }
            .nav-links { position: fixed; top: 70px; left: 0; right: 0; background: rgba(26, 26, 46, 0.98); flex-direction: column; gap: 0; padding: 2rem; transform: translateY(-100%); opacity: 0; transition: all 0.3s ease; pointer-events: none; max-height: calc(100vh - 70px); overflow-y: auto; }
            [data-theme="dark"] .nav-links { background: rgba(15, 15, 30, 0.98); }
            .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: all; }
            .nav-links li { padding: 1.25rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .nav-links li:last-child { border-bottom: none; }
            .nav-links a { font-size: 1.1rem; display: block; padding: 0.5rem 0; }
        }

        /* ---- Page body ---- */
        main { padding-top: 110px; max-width: 1200px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; padding-bottom: 4rem; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 7vw, 4rem); text-align: center; letter-spacing: 0.05em; color: var(--text-primary); margin: 1rem 0 0.25rem; }
        .page-subtitle { text-align: center; color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        /* ---- Scoreboard header ---- */
        .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px var(--card-shadow); margin-bottom: 2.5rem; }
        .team-panel { padding: 2rem 1.5rem; color: white; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .team-panel.red { background: linear-gradient(135deg, var(--team-red), var(--team-red-dark)); }
        .team-panel.blue { background: linear-gradient(135deg, var(--team-blue), var(--team-blue-dark)); text-align: right; }
        .team-panel.blue .team-name { text-align: right; }
        .team-side-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.85; }
        .team-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: 0.03em; line-height: 1.05; margin: 0.25rem 0; }
        .team-points { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 9vw, 5rem); line-height: 1; }
        .team-points-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.8; }
        .vs-divider { background: var(--dark); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em; padding: 0 1rem; min-width: 70px; }
        [data-theme="dark"] .vs-divider { background: #0a0a14; }
        .roster { margin-top: 1rem; font-size: 0.82rem; opacity: 0.9; line-height: 1.5; }
        .roster span { display: inline; }
        @media (max-width: 600px) {
            .scoreboard { grid-template-columns: 1fr; }
            .team-panel.blue, .team-panel.blue .team-name { text-align: center; }
            .vs-divider { padding: 0.5rem; min-height: 44px; }
            .roster { display: none; }
        }

        /* ---- Week sections ---- */
        .week-section { background: var(--bg-secondary); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.75rem; box-shadow: 0 6px 24px var(--card-shadow); border: 1px solid rgba(0, 78, 137, 0.08); }
        [data-theme="dark"] .week-section { border-color: rgba(255, 255, 255, 0.05); }
        .week-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border-color); }
        .week-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.04em; color: var(--text-primary); }
        .week-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.45rem; align-items: center; }
        .week-date { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .week-format { border: 1px solid var(--border-color); border-radius: 999px; padding: 0.12rem 0.55rem; color: var(--secondary); background: var(--bg-primary); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
        .week-tally { font-size: 0.85rem; color: var(--text-tertiary); font-weight: 600; }

        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.85rem; }
        .match-card { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.5rem; background: var(--bg-tertiary); border-radius: 10px; padding: 0.85rem 0.9rem; border: 1px solid var(--border-color); position: relative; }
        .match-card.has-winner { border-color: var(--green); }
        .match-card.doubles { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; }
        [data-theme="dark"] .match-card { background: var(--bg-primary); }
        .match-num { position: absolute; top: -8px; left: 10px; background: var(--dark); color: white; font-size: 0.7rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 8px; letter-spacing: 0.05em; }
        [data-theme="dark"] .match-num { background: var(--accent); color: var(--dark); }
        .player { font-size: 0.92rem; font-weight: 600; color: var(--text-secondary); padding: 0.35rem 0.4rem; border-radius: 6px; min-width: 0; word-break: break-word; }
        .player.red { text-align: left; }
        .player.blue { text-align: right; }
        .player.pair { display: flex; flex-direction: column; gap: 0.25rem; justify-content: center; }
        .pair-seeds { color: var(--text-muted); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
        .pair-name { display: block; line-height: 1.25; }
        .player.winner { background: var(--green); color: #fff; font-weight: 800; }
        .player.winner .pair-seeds { color: rgba(255, 255, 255, 0.82); }
        .match-result { text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; letter-spacing: 0.04em; color: var(--text-primary); min-width: 46px; }
        .match-result.unplayed { color: var(--text-muted); font-weight: 400; }
        .match-result .res-tie { color: var(--accent); font-size: 0.85rem; font-family: 'Archivo', sans-serif; font-weight: 700; }
        .match-result .res-winner { display: inline-block; background: var(--green); color: #fff; border-radius: 999px; padding: 0.15rem 0.45rem; font-family: 'Archivo', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; }

        /* ---- States ---- */
        .status-box { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); }
        .status-box .spinner { width: 42px; height: 42px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 1rem; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box.error { color: var(--team-red); }
        .retry-btn { margin-top: 1rem; background: var(--primary-strong); color: white; border: none; padding: 0.75rem 1.75rem; min-height: 44px; border-radius: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.3s ease; }
        .retry-btn:hover { background: #ff7f4d; transform: translateY(-2px); }
        .last-updated { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 1.5rem; }
        .back-link { display: inline-block; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--primary); }
        .league-nav { text-align: center; margin: -1rem 0 1.75rem; }
        .league-nav .back-link { margin-top: 0; color: var(--secondary); font-weight: 700; }
        .league-nav .back-link:hover { color: var(--primary); }
        .scoring-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 0.5rem auto 2rem; max-width: 640px; line-height: 1.5; }

        /* ---- Footer (mirrors index.html) ---- */
        footer { background: linear-gradient(135deg, var(--dark) 0%, #0d1a0d 100%); color: white; text-align: center; padding: 2.5rem 2rem; font-size: 0.95rem; border-top: 3px solid var(--accent); }
        [data-theme="dark"] footer { background: linear-gradient(135deg, var(--bg-secondary) 0%, #0a0a14 100%); }
        @media print { header, footer { display: none; } }
    </style>
  <script type="module" src="public-app/public-app.js"></script>
  <script src="pwa.js" defer></script>
</head>
<body>
    <div id="publicReactPageChrome"></div>

    <div id="ryderCupReactApp"></div>
    <div id="crottsReactApp"></div>

    <footer><p>&copy; 2026 Greenville Disc Golf Club. All rights reserved. | Greenville, NC</p></footer>
</body>
</html>
