<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Club">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Live Scoring · Greenville Disc Golf Club</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="pwa.js" defer></script>
    <link rel="stylesheet" href="tokens.css">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: contain;
        }
        .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        /* ---- top bar ---- */
        .topbar {
            position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 0.45rem;
            min-height: calc(56px + var(--safe-top)); padding: calc(0.55rem + var(--safe-top)) 0.65rem 0.55rem; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color); box-shadow: 0 1px 8px var(--shadow);
        }
        .topbar .logo {
            width: 32px; height: 32px; flex: 0 0 32px; object-fit: cover; object-position: left center; padding: 2px;
            border-radius: 8px; background: var(--bg-primary); border: 1px solid var(--border-color);
        }
        .topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.08rem, 4.8vw, 1.4rem); letter-spacing: 0.04em; font-weight: 400; flex: 1; line-height: 1; min-width: 0; overflow: hidden; }
        .topbar h1 small { display: block; font-family: 'Archivo'; font-size: 0.58rem; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-link {
            display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: 0 0 40px; padding: 0;
            border: 1px solid var(--border-color); border-radius: 11px; background: var(--bg-tertiary); color: var(--primary);
            font-size: 0.78rem; font-weight: 700; text-decoration: none;
        }
        .top-link-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .iconbtn {
            border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary);
            width: 40px; height: 40px; flex: 0 0 40px; border-radius: 11px; font-size: 1rem; cursor: pointer; display: grid; place-items: center;
        }
        .top-link svg, .iconbtn svg { width: 18px; height: 18px; }
        .iconbtn[hidden] { display: none; }
        .iconbtn:active { transform: scale(0.94); }
        @media (max-width: 420px) {
            .topbar { gap: 0.35rem; padding-left: 0.5rem; padding-right: 0.5rem; }
            .topbar .logo { width: 28px; height: 28px; flex-basis: 28px; }
            .topbar h1 small { font-size: 0.54rem; }
            .top-link, .iconbtn { width: 38px; height: 38px; flex-basis: 38px; border-radius: 10px; }
        }
        main { flex: 1; padding: 1rem 0.9rem calc(1.2rem + var(--safe-bottom)); }
        /* ---- generic ---- */
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 2px 10px var(--shadow); padding: 1rem; margin-bottom: 0.85rem; }
        .muted { color: var(--text-muted); }
        .dormie-badge { display: inline-block; margin-top: 0.35rem; padding: 0.22rem 0.6rem; border-radius: 999px; background: var(--secondary); color: #fff; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
        .weather-strip { background: var(--bg-secondary); border: 1px solid var(--border-color); border-left: 4px solid var(--secondary); border-radius: 14px; box-shadow: 0 2px 10px var(--shadow); padding: 0.85rem; margin-bottom: 0.85rem; }
        .weather-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.65rem; }
        .weather-title { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
        .weather-updated { flex: 0 0 auto; color: var(--text-muted); font-size: 0.68rem; font-weight: 700; }
        .weather-main { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0.75rem; }
        .weather-condition { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
        .weather-temp { flex: 0 0 auto; font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 0.9; letter-spacing: 0.04em; color: var(--primary); }
        .weather-copy { display: grid; gap: 0.12rem; min-width: 0; color: var(--text-secondary); }
        .weather-copy strong { color: var(--text-primary); font-size: 0.98rem; line-height: 1.15; }
        .weather-copy span { color: var(--text-muted); font-size: 0.78rem; line-height: 1.2; }
        .weather-graphic { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-tertiary); line-height: 1; }
        .weather-graphic-icon { font-size: 2rem; line-height: 1; }
        .weather-wind { display: flex; align-items: center; gap: 0.55rem; min-height: 48px; padding: 0.45rem 0.65rem; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-tertiary); color: var(--text-primary); font: inherit; cursor: pointer; }
        .weather-wind:active { transform: scale(0.98); }
        .weather-wind svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--secondary); }
        .weather-wind[data-relative="facing"] svg { color: var(--primary); }
        .weather-wind-copy { display: grid; gap: 0.05rem; text-align: left; }
        .weather-wind-copy strong { font-size: 0.86rem; line-height: 1.1; white-space: nowrap; }
        .weather-wind-copy span { color: var(--text-muted); font-size: 0.68rem; line-height: 1.15; white-space: nowrap; }
        .weather-wind-mode { text-transform: uppercase; letter-spacing: 0.04em; }
        .weather-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.7rem; }
        .weather-meta span { border: 1px solid var(--border-color); border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); padding: 0.2rem 0.5rem; font-size: 0.72rem; line-height: 1.2; }
        .weather-empty { color: var(--text-secondary); font-size: 0.86rem; }
        .weather-note { margin-top: 0.55rem; color: var(--text-muted); font-size: 0.72rem; line-height: 1.35; }
        @media (max-width: 420px) {
            .weather-head { align-items: flex-start; }
            .weather-main { grid-template-columns: minmax(0, 1fr) auto; }
            .weather-graphic { width: 48px; height: 48px; }
            .weather-graphic-icon { font-size: 1.85rem; }
            .weather-wind { grid-column: 1 / -1; justify-content: flex-start; width: 100%; }
        }
        .center { text-align: center; }
        .stack > * + * { margin-top: 0.7rem; }
        h2.section { font-family: 'Bebas Neue'; font-weight: 400; font-size: 1.5rem; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; width: 100%;
            min-height: 50px; padding: 0 1rem; border: none; border-radius: 13px; font-family: 'Archivo'; font-weight: 700;
            font-size: 1rem; cursor: pointer; background: var(--primary-strong); color: #fff; transition: transform .06s, filter .15s;
        }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn.danger { background: var(--over); color: white; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.small { min-height: 40px; width: auto; font-size: 0.85rem; padding: 0 0.85rem; border-radius: 10px; }
        input.field {
            width: 100%; min-height: 50px; padding: 0 0.9rem; border: 1.5px solid var(--border-color);
            border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; font-family: 'Archivo';
        }
        input.field:focus { outline: none; border-color: var(--primary); }
        label.lbl { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); display: block; margin: 0 0 0.3rem 0.2rem; }
        .stack > label.lbl { margin-top: 0.8rem; }
        .pill { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 0.2rem 0.5rem; border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); }
        .pill.live { background: var(--primary-strong); color: #fff; }
        .offline-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: var(--over); color: #fff; text-align: center; font-size: 0.78rem; font-weight: 700; line-height: 1.25; padding: calc(0.3rem + var(--safe-top)) 0.5rem 0.3rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
        .offline-bar svg { width: 16px; height: 16px; flex: 0 0 16px; }
        .toast {
            position: fixed; left: 50%; bottom: calc(1.2rem + var(--safe-bottom)); transform: translateX(-50%);
            display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; line-height: 1.3;
            background: var(--text-primary); color: var(--bg-secondary); padding: 0.7rem 1.1rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 600; box-shadow: 0 4px 16px var(--shadow); z-index: 50; max-width: 90%; text-align: center;
        }
        .toast.conflict { bottom: auto; top: calc(0.8rem + var(--safe-top)); background: var(--over); color: #fff; font-weight: 700; max-width: 94%; cursor: pointer; transition: opacity .5s; z-index: 70; }
        .toast.conflict.with-offline { top: calc(2.4rem + var(--safe-top)); }
        .toast.is-hiding { opacity: 0; transition: opacity .3s; }
        .toast svg { flex: 0 0 18px; }
        /* ---- event / card pickers ---- */
        .tap-row {
            display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 0.85rem; cursor: pointer; margin-bottom: 0.6rem; color: var(--text-primary);
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .tap-row:active { transform: scale(0.99); }
        .tap-row .grow { flex: 1; min-width: 0; }
        .tap-row .title { font-weight: 700; font-size: 1.02rem; color: var(--text-primary); }
        .tap-row .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
        .tap-row .chev { color: var(--text-muted); font-size: 1.3rem; }
        .setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
        .setup-option {
            min-height: 58px; padding: 0.6rem 0.65rem; border: 1px solid var(--border-color); border-radius: 12px;
            background: var(--bg-primary); color: var(--text-primary); cursor: pointer; text-align: left;
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .setup-option[aria-pressed="true"] { border-color: var(--primary); background: var(--bg-tertiary); box-shadow: inset 0 0 0 1px var(--primary); }
        .setup-option .title { display: block; font-weight: 700; font-size: 0.95rem; line-height: 1.2; }
        .setup-option .sub { display: block; color: var(--text-muted); font-size: 0.72rem; line-height: 1.25; margin-top: 0.15rem; }
        .avatars { display: flex; }
        .ava { width: 26px; height: 26px; border-radius: 50%; background: var(--secondary); color: #fff; display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; margin-left: -6px; border: 2px solid var(--bg-secondary); }
        .ava:first-child { margin-left: 0; }
        /* ---- scorecard ---- */
        .hole-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.8rem; }
        .hole-head .hnum { font-family: 'Bebas Neue'; font-size: 2.6rem; line-height: 0.9; color: var(--primary); }
        .hole-head .hmeta { text-align: right; }
        .hole-head .hpar { font-size: 1.5rem; font-weight: 700; }
        .round-tools { display: flex; align-items: center; justify-content: space-between; gap: 0.55rem; padding: 0.55rem 0.85rem; }
        .round-code { flex: 0 0 auto; line-height: 1.05; }
        .round-code .muted { display: block; }
        .round-code strong { letter-spacing: 1.5px; }
        .round-actions { display: flex; flex: 1 1 auto; justify-content: flex-end; gap: 0.4rem; min-width: 0; }
        .round-actions .btn { width: auto; min-width: 64px; white-space: nowrap; padding-inline: 0.65rem; }
        .navbtn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary); font-size: 1.4rem; cursor: pointer; display: grid; place-items: center; }
        .navbtn svg { width: 20px; height: 20px; }
        .navbtn:disabled { opacity: 0.35; }
        .tee-sign-card { padding: 0.55rem; overflow: hidden; }
        .tee-sign-card img { display: block; width: 100%; aspect-ratio: 16 / 10; max-height: 230px; object-fit: cover; object-position: center; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-color); }
        .tee-sign-caption { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.45rem; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
        .scorecard-owner { display: flex; align-items: center; gap: 0.65rem; padding-bottom: 0.75rem; margin-bottom: 0.1rem; border-bottom: 1px solid var(--border-color); }
        .scorecard-owner label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); white-space: nowrap; }
        .scorecard-owner select {
            flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--border-color); border-radius: 10px;
            background: var(--bg-primary); color: var(--text-primary); font: 700 0.95rem 'Archivo'; padding: 0 0.65rem;
        }
        .scorecard-owner + .prow { border-top: none; }
        .prow { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px solid var(--border-color); }
        .prow:first-child { border-top: none; }
        .prow.conflict { border-left: 4px solid var(--over); padding-left: 0.55rem; background: var(--over-soft); }
        .prow .pinfo { flex: 1; min-width: 0; }
        .prow .pname { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prow .pmeta { font-size: 0.74rem; color: var(--text-muted); }
        .prow .conflict-text { color: var(--over); font-weight: 700; }
        .stepper { display: flex; align-items: center; gap: 0.45rem; }
        .stepper button { width: 44px; height: 44px; border-radius: 50%; border: none; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
        .stepper button.minus { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .stepper button.plus { background: var(--primary-strong); color: #fff; }
        .stepper button:active { transform: scale(0.9); }
        .stepper .val { width: 50px; text-align: center; }
        .stepper .val .n { font-size: 1.55rem; font-weight: 700; line-height: 1; }
        .stepper .val .rel { font-size: 0.72rem; font-weight: 700; }
        .rel.under { color: var(--under); } .rel.over { color: var(--over); } .rel.even { color: var(--even); }
        .totbar { display: flex; justify-content: space-around; margin-top: 0.9rem; padding-top: 0.8rem; border-top: 2px solid var(--border-color); }
        .totbar div { text-align: center; }
        .totbar .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 700; }
        .totbar .v { font-size: 1.3rem; font-weight: 700; }
        .holegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 0.5rem; }
        .holegrid button { min-height: 44px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); position: relative; }
        .holegrid button.cur { background: var(--primary-strong); color: #fff; border-color: var(--primary); }
        .holegrid button.done::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--under); }
        .holegrid button.cur.done::after { background: #fff; }
        .holegrid button.conflict { border-color: var(--over); color: var(--over); box-shadow: inset 0 0 0 1px var(--over); }
        .holegrid button.conflict::before { content: "⚑"; position: absolute; right: 4px; top: 2px; font-size: 0.7rem; line-height: 1; }
        .holegrid button.cur.conflict { background: var(--over); border-color: var(--over); color: #fff; }
        .holegrid button.cur.conflict::before { color: #fff; }
        /* ---- leaderboard overlay ---- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
        .sheet { background: var(--bg-secondary); border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto; padding: 1rem 0.9rem calc(1.4rem + var(--safe-bottom)); }
        .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-color); margin: 0 auto 0.7rem; }
        table.lb { width: 100%; border-collapse: collapse; }
        table.lb th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); padding: 0.4rem 0.4rem; border-bottom: 2px solid var(--border-color); }
        table.lb td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border-color); font-size: 0.92rem; }
        table.lb td.pos { font-weight: 700; color: var(--text-muted); width: 1.6rem; }
        table.lb td.name { font-weight: 700; }
        table.lb td.tp.under { color: var(--under); } table.lb td.tp.over { color: var(--over); }
        .finalize-card { margin-top: 1rem; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-primary); }
        .finalize-card.ready { border-color: var(--under); }
        .finalize-head { font-weight: 700; margin-bottom: 0.2rem; color: var(--over); }
        .finalize-card.ready .finalize-head { color: var(--under); }
        .finalize-line { font-size: 0.82rem; }
        .finish-round-btn { margin-top: 0.7rem; }
        .finish-round-hint { font-size: 0.8rem; margin-top: 0.4rem; }
        .manage-pairs { margin: 0.75rem 0; }
        .manage-pair-field { display: grid; gap: 0.35rem; }
        .manage-player-row { justify-content: space-between; }
        .manage-player-row .btn { width: auto; min-width: 96px; }
        .score-dialog-overlay { z-index: 90; justify-content: center; padding: calc(1rem + var(--safe-top)) 1rem calc(1rem + var(--safe-bottom)); }
        .score-dialog { width: min(100%, 430px); max-height: min(82vh, 560px); margin: auto; border-radius: 18px; padding: 1rem; box-shadow: 0 20px 60px var(--shadow); }
        .score-dialog-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--bg-tertiary); color: var(--primary); margin-bottom: 0.7rem; }
        .score-dialog-icon.danger { color: var(--over); }
        .score-dialog-field { margin-top: 0.9rem; }
        .score-dialog-field span { display: block; margin-bottom: 0.35rem; }
        .score-dialog-actions { display: flex; gap: 0.55rem; margin-top: 1rem; }
        .score-dialog-actions .btn { width: auto; flex: 1 1 0; }
        .auth-error { color: var(--over); min-height: 1rem; }
        .sheet-close { margin-top: 1rem; }
        .spin { width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 1.5rem auto; }
        @keyframes sp { to { transform: rotate(360deg); } }
        a.link { color: var(--primary); font-weight: 700; text-decoration: none; }
        .return-members .link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 0.25rem; }
    </style>
</head>
<body data-api-base="">
    <div id="scoreRoot"></div>
    <div id="scoreReactNotificationsApp"></div>
    <div id="scoreReactLeaderboardSheetApp"></div>
    <div id="scoreReactManagePlayersSheetApp"></div>
    <div id="scoreReactDialogsApp"></div>
    <script type="module" src="score-app/score-app.js"></script>
</body>
</html>
