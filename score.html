<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GVDG Score">
    <title>Live Scoring · Greenville Disc Golf Club</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35; --secondary: #004E89; --accent: #F7B801;
            --bg-primary: #F4F4F9; --bg-secondary: #FFFFFF; --bg-tertiary: #EEEEF4;
            --text-primary: #1A1A2E; --text-secondary: #444; --text-muted: #6A6A78;
            --border-color: #E2E2EA; --shadow: rgba(0,0,0,0.10);
            --under: #15743A; --over: #C8472E; --even: #6A6A78;
            --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        [data-theme="dark"] {
            --bg-primary: #0F0F1E; --bg-secondary: #1A1A2E; --bg-tertiary: #252538;
            --text-primary: #F4F4F9; --text-secondary: #D8D8E0; --text-muted: #9A9AAC;
            --border-color: #2C2C40; --shadow: rgba(0,0,0,0.4);
            --under: #4FD37E; --over: #FF7A5C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: contain;
        }
        .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        /* ---- top bar ---- */
        .topbar {
            position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 0.6rem;
            padding: calc(0.7rem + var(--safe-top)) 0.9rem 0.7rem; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color); box-shadow: 0 1px 8px var(--shadow);
        }
        .topbar .logo { height: 30px; width: auto; }
        .topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.5px; font-weight: 400; flex: 1; line-height: 1; }
        .topbar h1 small { display: block; font-family: 'Archivo'; font-size: 0.62rem; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .iconbtn {
            border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary);
            width: 40px; height: 40px; border-radius: 11px; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center;
        }
        .iconbtn:active { transform: scale(0.94); }
        main { flex: 1; padding: 1rem 0.9rem calc(1.2rem + var(--safe-bottom)); }
        /* ---- generic ---- */
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 2px 10px var(--shadow); padding: 1rem; margin-bottom: 0.85rem; }
        .muted { color: var(--text-muted); }
        .center { text-align: center; }
        .stack > * + * { margin-top: 0.7rem; }
        h2.section { font-family: 'Bebas Neue'; font-weight: 400; font-size: 1.5rem; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; width: 100%;
            min-height: 50px; padding: 0 1rem; border: none; border-radius: 13px; font-family: 'Archivo'; font-weight: 700;
            font-size: 1rem; cursor: pointer; background: var(--primary); color: #fff; transition: transform .06s, filter .15s;
        }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.small { min-height: 40px; width: auto; font-size: 0.85rem; padding: 0 0.85rem; border-radius: 10px; }
        input.field {
            width: 100%; min-height: 50px; padding: 0 0.9rem; border: 1.5px solid var(--border-color);
            border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; font-family: 'Archivo';
        }
        input.field:focus { outline: none; border-color: var(--primary); }
        label.lbl { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); display: block; margin: 0 0 0.3rem 0.2rem; }
        .pill { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 0.2rem 0.5rem; border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); }
        .pill.live { background: var(--primary); color: #fff; }
        .toast {
            position: fixed; left: 50%; bottom: calc(1.2rem + var(--safe-bottom)); transform: translateX(-50%);
            background: var(--text-primary); color: var(--bg-secondary); padding: 0.7rem 1.1rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 600; box-shadow: 0 4px 16px var(--shadow); z-index: 50; max-width: 90%; text-align: center;
        }
        /* ---- event / card pickers ---- */
        .tap-row {
            display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 0.85rem; cursor: pointer; margin-bottom: 0.6rem;
        }
        .tap-row:active { transform: scale(0.99); }
        .tap-row .grow { flex: 1; min-width: 0; }
        .tap-row .title { font-weight: 700; font-size: 1.02rem; }
        .tap-row .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
        .tap-row .chev { color: var(--text-muted); font-size: 1.3rem; }
        .avatars { display: flex; }
        .ava { width: 26px; height: 26px; border-radius: 50%; background: var(--secondary); color: #fff; display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; margin-left: -6px; border: 2px solid var(--bg-secondary); }
        .ava:first-child { margin-left: 0; }
        /* ---- scorecard ---- */
        .hole-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.8rem; }
        .hole-head .hnum { font-family: 'Bebas Neue'; font-size: 2.6rem; line-height: 0.9; color: var(--primary); }
        .hole-head .hmeta { text-align: right; }
        .hole-head .hpar { font-size: 1.5rem; font-weight: 700; }
        .navbtn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary); font-size: 1.4rem; cursor: pointer; }
        .navbtn:disabled { opacity: 0.35; }
        .prow { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px solid var(--border-color); }
        .prow:first-child { border-top: none; }
        .prow .pinfo { flex: 1; min-width: 0; }
        .prow .pname { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prow .pmeta { font-size: 0.74rem; color: var(--text-muted); }
        .stepper { display: flex; align-items: center; gap: 0.45rem; }
        .stepper button { width: 44px; height: 44px; border-radius: 50%; border: none; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
        .stepper button.minus { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .stepper button.plus { background: var(--primary); color: #fff; }
        .stepper button:active { transform: scale(0.9); }
        .stepper .val { width: 50px; text-align: center; }
        .stepper .val .n { font-size: 1.55rem; font-weight: 700; line-height: 1; }
        .stepper .val .rel { font-size: 0.72rem; font-weight: 700; }
        .rel.under { color: var(--under); } .rel.over { color: var(--over); } .rel.even { color: var(--even); }
        .totbar { display: flex; justify-content: space-around; margin-top: 0.9rem; padding-top: 0.8rem; border-top: 2px solid var(--border-color); }
        .totbar div { text-align: center; }
        .totbar .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 700; }
        .totbar .v { font-size: 1.3rem; font-weight: 700; }
        .holegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 0.5rem; }
        .holegrid button { min-height: 44px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); position: relative; }
        .holegrid button.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
        .holegrid button.done::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--under); }
        .holegrid button.cur.done::after { background: #fff; }
        /* ---- leaderboard overlay ---- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
        .sheet { background: var(--bg-secondary); border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto; padding: 1rem 0.9rem calc(1.4rem + var(--safe-bottom)); }
        .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-color); margin: 0 auto 0.7rem; }
        table.lb { width: 100%; border-collapse: collapse; }
        table.lb th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); padding: 0.4rem 0.4rem; border-bottom: 2px solid var(--border-color); }
        table.lb td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border-color); font-size: 0.92rem; }
        table.lb td.pos { font-weight: 700; color: var(--text-muted); width: 1.6rem; }
        table.lb td.name { font-weight: 700; }
        table.lb td.tp.under { color: var(--under); } table.lb td.tp.over { color: var(--over); }
        .spin { width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 1.5rem auto; }
        @keyframes sp { to { transform: rotate(360deg); } }
        a.link { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body data-api-base="https://auth.greenvillediscgolf.com">
    <div class="wrap">
        <header class="topbar">
            <img src="img/logo.png" alt="GVDG" class="logo">
            <h1 id="barTitle">Live Scoring<small id="barSub">Greenville Disc Golf Club</small></h1>
            <button class="iconbtn" id="lbBtn" title="Leaderboard" hidden>🏆</button>
            <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
        </header>
        <main id="app"><div class="spin"></div></main>
    </div>
    <script>
    (function () {
        "use strict";
        const API_BASE = (document.body.dataset.apiBase || "https://auth.greenvillediscgolf.com").replace(/\/+$/, "");
        const TOKEN_KEY = "gvdg_member_token", NAME_KEY = "gvdg_member_name";
        const app = document.getElementById("app");

        // ---- theme ----
        if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("themeBtn").addEventListener("click", function () {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); }
            else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); }
        });

        // ---- tiny XSS-safe DOM helper ----
        function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
        function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
        function initials(name) { return String(name || "?").trim().split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase(); }
        function token() { return sessionStorage.getItem(TOKEN_KEY); }
        function myId() { try { const p = JSON.parse(atob(token().split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); return p.sub || null; } catch (e) { return null; } }
        function toast(msg) {
            const t = el("div", "toast", msg); document.body.appendChild(t);
            setTimeout(function () { t.remove(); }, 2600);
        }
        async function api(path, opts) {
            opts = opts || {};
            const headers = {};
            if (opts.body !== undefined) headers["Content-Type"] = "application/json";
            if (opts.auth !== false && token()) headers["Authorization"] = "Bearer " + token();
            const r = await fetch(API_BASE + path, { method: opts.method || "GET", headers: headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
            let data = null; try { data = await r.json(); } catch (e) {}
            return { status: r.status, ok: r.ok, data: data };
        }
        function fmtToPar(n) { n = n || 0; return n === 0 ? "E" : (n > 0 ? "+" + n : String(n)); }
        function relClass(n) { return n < 0 ? "under" : (n > 0 ? "over" : "even"); }

        // ---- app state ----
        const S = { screen: "boot", eventId: null, eventName: "", snap: null, cardId: null, holeIdx: 0, roster: [], ws: null, pending: {} };
        // Optimistic score overlay keyed `pid:hole` -> strokes. Survives WebSocket echoes (which may carry an
        // OLDER state) until the server snapshot confirms the same value, then the key is cleared. This is what
        // keeps rapid taps correct when our own writes and other cardmates' writes interleave over the socket.
        const pkey = function (pid, hole) { return pid + ":" + hole; };
        function scoreOf(p, hole) {
            const k = pkey(p.pid, hole);
            if (S.pending[k] != null) return S.pending[k];
            return p.scores && p.scores[hole] != null ? p.scores[hole] : null;
        }
        function reconcilePending() {
            const cd = curCard();
            if (!cd) return;
            const byPid = {}; (cd.players || []).forEach(function (p) { byPid[p.pid] = p; });
            Object.keys(S.pending).forEach(function (k) {
                const pid = k.slice(0, k.indexOf(":")), hole = Number(k.slice(k.indexOf(":") + 1));
                const p = byPid[pid];
                if (p && p.scores && p.scores[hole] === S.pending[k]) delete S.pending[k]; // server confirmed
            });
        }
        function setBar(title, sub) { document.getElementById("barTitle").firstChild.textContent = title; document.getElementById("barSub").textContent = sub || ""; }
        const lbBtn = document.getElementById("lbBtn");
        lbBtn.addEventListener("click", openLeaderboard);

        let wsRetry = 0;
        function teardownWs() { if (S.ws) { try { S.ws.onclose = null; S.ws.close(); } catch (e) {} S.ws = null; } }
        function connectWs() {
            teardownWs();
            if (!S.eventId) return;
            const eid = S.eventId;
            try {
                const ws = new WebSocket(API_BASE.replace(/^http/, "ws") + "/events/" + encodeURIComponent(eid) + "/live/ws");
                S.ws = ws;
                ws.onopen = function () { wsRetry = 0; };
                ws.onmessage = function (e) {
                    try {
                        const snap = JSON.parse(e.data);
                        S.snap = snap; reconcilePending();
                        if (S.screen === "event") renderEvent();
                        else if (S.screen === "scoring") renderScoring(true);
                        // Only the leaderboard sheet has #lbBody; other sheets (cardmate/guest) must not be touched.
                        const lbBody = document.getElementById("lbBody");
                        if (lbBody) renderLbInto(lbBody, snap);
                    } catch (e2) {}
                };
                // Auto-reconnect with capped backoff — mobile screens sleep/background and drop the socket.
                ws.onclose = function () {
                    if (S.ws !== ws || S.eventId !== eid || (S.screen !== "event" && S.screen !== "scoring")) return;
                    wsRetry = Math.min(wsRetry + 1, 6);
                    setTimeout(function () { if (S.eventId === eid && (S.screen === "event" || S.screen === "scoring")) connectWs(); }, 400 * Math.pow(2, wsRetry - 1));
                };
            } catch (e) {}
        }

        // ============ screens ============
        function showBoot() { clear(app).appendChild(el("div", "spin")); }

        // ---- login ----
        function renderLogin(msg) {
            S.screen = "login"; teardownWs(); lbBtn.hidden = true; setBar("Live Scoring", "Greenville Disc Golf Club");
            const c = clear(app);
            const card = el("div", "card stack");
            card.appendChild(el("h2", "section", "Member sign in"));
            card.appendChild(el("p", "muted", "Sign in with your PDGA # or UDisc name to keep score."));
            if (msg) { const m = el("p", null, msg); m.style.color = "var(--over)"; card.appendChild(m); }
            const idWrap = el("div"); idWrap.appendChild(el("label", "lbl", "PDGA # or UDisc name"));
            const idIn = el("input", "field"); idIn.id = "liId"; idIn.autocomplete = "username"; idWrap.appendChild(idIn);
            const pinWrap = el("div"); pinWrap.appendChild(el("label", "lbl", "PIN"));
            const pinIn = el("input", "field"); pinIn.id = "liPin"; pinIn.type = "password"; pinIn.inputMode = "numeric"; pinIn.autocomplete = "current-password"; pinWrap.appendChild(pinIn);
            const btn = el("button", "btn", "Sign in");
            card.appendChild(idWrap); card.appendChild(pinWrap); card.appendChild(btn);
            const note = el("p", "muted center"); note.style.fontSize = "0.82rem";
            note.appendChild(document.createTextNode("Need to set your PIN or register? "));
            const a = el("a", "link", "Open the Members page"); a.href = "gvdg-members.html"; note.appendChild(a);
            card.appendChild(note);
            c.appendChild(card);
            async function doLogin() {
                const identifier = idIn.value.trim(), pin = pinIn.value.trim();
                if (!identifier || !pin) return toast("Enter your ID and PIN");
                btn.disabled = true; btn.textContent = "Signing in…";
                const r = await api("/login", { method: "POST", auth: false, body: { identifier: identifier, pin: pin } });
                btn.disabled = false; btn.textContent = "Sign in";
                if (r.status === 423) return toast("Too many tries — locked out briefly");
                if (!r.ok || !r.data || !r.data.token) return toast("Wrong ID or PIN");
                sessionStorage.setItem(TOKEN_KEY, r.data.token);
                if (r.data.name) sessionStorage.setItem(NAME_KEY, r.data.name);
                if (r.data.mustChangePin) return renderLogin("Please set your own PIN on the Members page first, then come back.");
                pickEvent();
            }
            btn.addEventListener("click", doLogin);
            pinIn.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
        }

        // ---- pick a live event ----
        async function pickEvent() {
            S.screen = "pickEvent"; teardownWs(); lbBtn.hidden = true; S.eventId = null; S.cardId = null;
            setBar("Live Scoring", "Choose what to score"); showBoot();
            const r = await api("/events?status=live", { auth: false });
            const events = (r.data && r.data.events) || [];
            const c = clear(app);
            const head = el("div", "stack"); head.style.marginBottom = "0.4rem";
            c.appendChild(head);
            c.appendChild(el("h2", "section", "Live events"));
            if (!events.length) {
                const empty = el("div", "card center stack");
                empty.appendChild(el("p", null, "🥏"));
                empty.appendChild(el("p", "muted", "No live events right now. When an organizer opens scoring for an event, it’ll appear here."));
                c.appendChild(empty);
            } else {
                events.forEach(function (ev) {
                    const row = el("button", "tap-row");
                    const g = el("div", "grow");
                    g.appendChild(el("div", "title", ev.name || "Event"));
                    g.appendChild(el("div", "sub", (ev.type ? String(ev.type).replace("_", " ") : "event") + (ev.date ? " · " + ev.date : "")));
                    row.appendChild(el("span", "pill live", "LIVE"));
                    row.appendChild(g);
                    row.appendChild(el("span", "chev", "›"));
                    row.addEventListener("click", function () { openEvent(ev.id, ev.name || "Event"); });
                    c.appendChild(row);
                });
            }
            // Casual round (Track N3)
            c.appendChild(el("h2", "section", "Casual round"));
            const casual = el("button", "btn ghost", "🥏 Start a casual round");
            casual.addEventListener("click", function () { toast("Casual rounds arrive in the next update"); });
            c.appendChild(casual);
            const logout = el("button", "btn secondary small", "Sign out"); logout.style.marginTop = "1.2rem";
            logout.addEventListener("click", function () { sessionStorage.removeItem(TOKEN_KEY); renderLogin(); });
            c.appendChild(logout);
        }

        // ---- open an event: load snapshot, decide card vs chooser ----
        async function openEvent(eventId, name) {
            S.eventId = eventId; S.eventName = name; S.screen = "event"; lbBtn.hidden = false; S.pending = {};
            setBar(name, "Live event"); showBoot();
            await refreshSnap();
            connectWs();
            renderEvent();
        }
        async function refreshSnap() {
            const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live", { auth: false });
            S.snap = r.data || { status: "none", cards: [], players: [], standings: [], holes: [] };
        }
        function myCard() {
            const me = myId(); if (!me || !S.snap) return null;
            return (S.snap.cards || []).find(function (c) { return (c.players || []).some(function (p) { return p.memberId === me; }); }) || null;
        }

        function renderEvent() {
            if (S.screen !== "event") return;
            const c = clear(app);
            const snap = S.snap || {};
            if (snap.status === "final") {
                const done = el("div", "card center stack");
                done.appendChild(el("h2", "section", "This event is final"));
                done.appendChild(el("p", "muted", "Scoring is closed. Check the standings on the leaderboard."));
                const lb = el("button", "btn", "View leaderboard"); lb.addEventListener("click", openLeaderboard); done.appendChild(lb);
                c.appendChild(done); backRow(c); return;
            }
            if (snap.status !== "live") {
                const ns = el("div", "card center stack");
                ns.appendChild(el("p", "muted", "Scoring for this event hasn’t been opened yet. Ask an organizer to start live scoring."));
                c.appendChild(ns); backRow(c); return;
            }
            const mine = myCard();
            if (mine) {
                const card = el("div", "card stack");
                card.appendChild(el("h2", "section", "You’re on " + (mine.label || "a card")));
                card.appendChild(cardPeople(mine));
                const go = el("button", "btn", "Keep score ▸"); go.addEventListener("click", function () { S.cardId = mine.id; S.holeIdx = firstUnplayed(mine); S.screen = "scoring"; renderScoring(); });
                card.appendChild(go);
                c.appendChild(card);
            } else {
                const join = el("div", "card stack");
                join.appendChild(el("h2", "section", "Join a card"));
                join.appendChild(el("p", "muted", "Hop on the card you’re playing with, or start a new one. Whoever’s keeping score adds throws for the whole group."));
                const create = el("button", "btn", "➕ Start a new card");
                create.addEventListener("click", createCard);
                join.appendChild(create);
                c.appendChild(join);
                const cards = (snap.cards || []);
                if (cards.length) {
                    const list = el("div"); list.appendChild(el("h2", "section", "Cards out there"));
                    cards.forEach(function (cd) {
                        const row = el("button", "tap-row");
                        const g = el("div", "grow");
                        g.appendChild(el("div", "title", cd.label || "Card"));
                        g.appendChild(el("div", "sub", (cd.players || []).map(function (p) { return p.name; }).join(", ") || "Empty"));
                        const av = el("div", "avatars");
                        (cd.players || []).slice(0, 4).forEach(function (p) { av.appendChild(el("div", "ava", initials(p.name))); });
                        row.appendChild(g); row.appendChild(av);
                        row.addEventListener("click", function () { joinCard(cd.id); });
                        list.appendChild(row);
                    });
                    c.appendChild(list);
                }
            }
            backRow(c);
        }
        function cardPeople(cd) {
            const box = el("div");
            (cd.players || []).forEach(function (p) {
                const row = el("div", "prow");
                row.appendChild(el("div", "ava", initials(p.name)));
                const info = el("div", "pinfo");
                info.appendChild(el("div", "pname", p.name + (p.isGuest ? " (guest)" : "")));
                if (p.division) info.appendChild(el("div", "pmeta", p.division));
                row.appendChild(info);
                box.appendChild(row);
            });
            return box;
        }
        function backRow(c) {
            const back = el("button", "btn secondary small", "‹ Back to events"); back.style.marginTop = "1rem";
            back.addEventListener("click", pickEvent); c.appendChild(back);
        }

        async function createCard() {
            const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live/cards", { method: "POST", body: {} });
            if (r.status === 403) return toast(r.data && r.data.error === "not_registered" ? "Register & check in for this event first" : "Not allowed");
            if (!r.ok) return toast("Could not start a card");
            S.snap = r.data; S.cardId = r.data && r.data.cardId; S.holeIdx = 0; S.screen = "scoring"; renderScoring();
        }
        async function joinCard(cardId) {
            const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live/cards/" + encodeURIComponent(cardId) + "/join", { method: "POST", body: {} });
            if (r.status === 403) return toast("Register & check in for this event first");
            if (r.status === 409) return toast("That card is full");
            if (!r.ok) return toast("Could not join");
            S.snap = r.data; S.cardId = cardId; S.holeIdx = 0; S.screen = "scoring"; renderScoring();
        }

        function curCard() { return ((S.snap && S.snap.cards) || []).find(function (c) { return c.id === S.cardId; }) || null; }
        function holes() { return (S.snap && S.snap.holes) || []; }
        function firstUnplayed(cd) {
            const hs = holes(); if (!hs.length) return 0;
            for (let i = 0; i < hs.length; i++) { const h = hs[i]; const someone = (cd.players || []).some(function (p) { return p.scores && p.scores[h.hole] != null; }); if (!someone) return i; }
            return 0;
        }

        // ---- the hole-by-hole scorecard ----
        function renderScoring(softUpdate) {
            S.screen = "scoring"; lbBtn.hidden = false;
            const cd = curCard();
            if (!cd) { return renderEvent(); }
            const hs = holes();
            if (S.holeIdx < 0) S.holeIdx = 0; if (S.holeIdx >= hs.length) S.holeIdx = hs.length - 1;
            const h = hs[S.holeIdx] || { hole: 1, par: 3 };
            setBar(cd.label || "Card", S.eventName);
            const c = clear(app);

            // hole header + nav
            const card = el("div", "card");
            const head = el("div", "hole-head");
            const prev = el("button", "navbtn", "‹"); prev.disabled = S.holeIdx === 0; prev.addEventListener("click", function () { S.holeIdx--; renderScoring(); });
            const mid = el("div"); mid.style.textAlign = "center"; mid.style.flex = "1";
            mid.appendChild(el("div", "hnum", "Hole " + h.hole));
            mid.appendChild(el("div", "hpar muted", "Par " + h.par));
            const next = el("button", "navbtn", "›"); next.disabled = S.holeIdx >= hs.length - 1; next.addEventListener("click", function () { S.holeIdx++; renderScoring(); });
            head.appendChild(prev); head.appendChild(mid); head.appendChild(next);
            card.appendChild(head);

            // player rows with steppers
            (cd.players || []).forEach(function (p) {
                const row = el("div", "prow");
                const info = el("div", "pinfo");
                info.appendChild(el("div", "pname", p.name + (p.isGuest ? " (guest)" : "")));
                const played = playedTotals(p, hs);
                info.appendChild(el("div", "pmeta", played.thru ? ("thru " + played.thru + " · " + fmtToPar(played.toPar)) : "not started"));
                row.appendChild(info);
                row.appendChild(stepper(cd, p, h));
                card.appendChild(row);
            });

            // card running totals
            const tot = el("div", "totbar");
            const teamThru = (cd.players || []).reduce(function (a, p) { return a + (p.scores && p.scores[h.hole] != null ? 1 : 0); }, 0);
            const tb1 = el("div"); tb1.appendChild(el("div", "k", "Players")); tb1.appendChild(el("div", "v", String((cd.players || []).length))); tot.appendChild(tb1);
            const tb2 = el("div"); tb2.appendChild(el("div", "k", "Scored this hole")); tb2.appendChild(el("div", "v", teamThru + "/" + (cd.players || []).length)); tot.appendChild(tb2);
            card.appendChild(tot);
            c.appendChild(card);

            // hole jump grid
            const grid = el("div", "card");
            grid.appendChild(el("label", "lbl", "Jump to hole"));
            const hg = el("div", "holegrid");
            hs.forEach(function (hh, i) {
                const b = el("button", null, String(hh.hole));
                if (i === S.holeIdx) b.classList.add("cur");
                const anyScore = (cd.players || []).some(function (p) { return scoreOf(p, hh.hole) != null; });
                if (anyScore) b.classList.add("done");
                b.addEventListener("click", function () { S.holeIdx = i; renderScoring(); });
                hg.appendChild(b);
            });
            grid.appendChild(hg);
            c.appendChild(grid);

            // card actions
            const actions = el("div", "card stack");
            const addMate = el("button", "btn secondary", "➕ Add a cardmate");
            addMate.addEventListener("click", openAddCardmate);
            const addGuest = el("button", "btn secondary", "👤 Add a guest");
            addGuest.addEventListener("click", addGuestFlow);
            const leave = el("button", "btn ghost", "Leave this card");
            leave.addEventListener("click", leaveFlow);
            actions.appendChild(addMate); actions.appendChild(addGuest); actions.appendChild(leave);
            c.appendChild(actions);

            const back = el("button", "btn secondary small", "‹ Back"); back.style.marginTop = "0.4rem";
            back.addEventListener("click", function () { S.screen = "event"; renderEvent(); });
            c.appendChild(back);
        }
        function playedTotals(p, hs) {
            let thru = 0, toPar = 0, total = 0;
            hs.forEach(function (h) { const s = scoreOf(p, h.hole); if (s != null) { thru++; total += s; toPar += s - h.par; } });
            return { thru: thru, toPar: toPar, total: total };
        }
        async function sendScore(cd, p, h, strokes) {
            strokes = Math.max(1, Math.min(30, strokes));
            const k = pkey(p.pid, h.hole);
            S.pending[k] = strokes;            // optimistic overlay (survives WS echoes until confirmed)
            renderScoring(true);
            const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live/score", { method: "POST", body: { cardId: cd.id, pid: p.pid, hole: h.hole, strokes: strokes } });
            if (r.ok && r.data) { S.snap = r.data; reconcilePending(); }
            else {
                delete S.pending[k];
                toast(r.status === 403 ? "You can only score your own card" : "Score didn’t save — try again");
                await refreshSnap();
            }
            renderScoring(true);
        }
        function stepper(cd, p, h) {
            const wrap = el("div", "stepper");
            const cur = scoreOf(p, h.hole); // current displayed value (optimistic overlay or confirmed)
            const minus = el("button", "minus", "−");
            minus.setAttribute("aria-label", "Decrease " + p.name + " score");
            const val = el("div", "val");
            const n = el("div", "n", cur != null ? String(cur) : "–"); val.appendChild(n);
            if (cur != null) { const rel = cur - h.par; val.appendChild(el("div", "rel " + relClass(rel), rel === 0 ? "par" : fmtToPar(rel))); }
            const plus = el("button", "plus", "+");
            plus.setAttribute("aria-label", "Increase " + p.name + " score");
            // First tap on an unscored hole sets par (then ± adjusts). Reads the LIVE value each click so rapid
            // taps and concurrent cardmate edits never compute from a stale closure.
            minus.addEventListener("click", function () { const c = scoreOf(p, h.hole); sendScore(cd, p, h, c != null ? c - 1 : h.par); });
            plus.addEventListener("click", function () { const c = scoreOf(p, h.hole); sendScore(cd, p, h, c != null ? c + 1 : h.par); });
            wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
            return wrap;
        }

        async function openAddCardmate() {
            const r = await api("/events/" + encodeURIComponent(S.eventId) + "/roster");
            const roster = (r.data && r.data.roster) || [];
            const onCard = {}; ((curCard() || {}).players || []).forEach(function (p) { if (p.memberId) onCard[p.memberId] = true; });
            const avail = roster.filter(function (m) { return m.memberId && !onCard[m.memberId]; });
            sheet("Add a cardmate", function (body) {
                if (!avail.length) { body.appendChild(el("p", "muted", "Everyone registered is already on a card.")); return; }
                avail.forEach(function (m) {
                    const row = el("button", "tap-row");
                    const g = el("div", "grow");
                    g.appendChild(el("div", "title", m.name));
                    g.appendChild(el("div", "sub", (m.division || "") + (m.checkedIn ? " · checked in" : "")));
                    row.appendChild(el("div", "ava", initials(m.name))); row.appendChild(g);
                    row.addEventListener("click", async function () {
                        const rr = await api("/events/" + encodeURIComponent(S.eventId) + "/live/cards/" + encodeURIComponent(S.cardId) + "/cardmate", { method: "POST", body: { memberId: m.memberId } });
                        closeSheet();
                        if (rr.status === 403) return toast("They need to be registered for this event");
                        if (rr.status === 409) return toast("Card is full or they’re on another card");
                        if (!rr.ok) return toast("Could not add");
                        S.snap = rr.data; renderScoring(true);
                    });
                    body.appendChild(row);
                });
            });
        }
        function addGuestFlow() {
            promptSheet("Add a guest", "Guest name", "Someone without the app", "Add guest", async function (name) {
                const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live/cards/" + encodeURIComponent(S.cardId) + "/guest", { method: "POST", body: { name: name } });
                if (r.status === 409) return toast("Card is full");
                if (!r.ok) return toast("Could not add guest");
                S.snap = r.data; renderScoring(true);
            });
        }
        function leaveFlow() {
            confirmSheet("Leave this card?", "Your scores on this card will be removed.", "Leave card", async function () {
                const me = myId(); const cd = curCard(); const meP = cd && (cd.players || []).find(function (p) { return p.memberId === me; });
                if (!meP) { S.screen = "event"; return renderEvent(); }
                const r = await api("/events/" + encodeURIComponent(S.eventId) + "/live/cards/" + encodeURIComponent(S.cardId) + "/leave", { method: "POST", body: { pid: meP.pid } });
                if (!r.ok) return toast("Could not leave");
                S.snap = r.data; S.cardId = null; S.screen = "event"; renderEvent();
            });
        }

        // ---- leaderboard sheet ----
        function openLeaderboard() {
            if (!S.snap) return;
            sheet("Live leaderboard", function (body) { body.id = "lbBody"; renderLbInto(body, S.snap); });
        }
        function renderLbInto(body, snap) {
            clear(body);
            const standings = (snap && snap.standings) || [];
            if (!standings.length) { body.appendChild(el("p", "muted center", "Waiting for the first throws…")); return; }
            const hasDiv = standings.some(function (s) { return s && s.division; });
            const table = el("table", "lb");
            const thead = el("thead"); const htr = el("tr");
            (hasDiv ? ["", "Player", "Div", "Thru", "Total", "+/−"] : ["", "Player", "Thru", "Total", "+/−"]).forEach(function (hh) { htr.appendChild(el("th", null, hh)); });
            thead.appendChild(htr); table.appendChild(thead);
            const tb = el("tbody");
            standings.forEach(function (s, i) {
                const tr = el("tr");
                tr.appendChild(el("td", "pos", String(i + 1)));
                tr.appendChild(el("td", "name", s.name || "Player"));
                if (hasDiv) tr.appendChild(el("td", null, s.division || "—"));
                tr.appendChild(el("td", null, s.thru ? String(s.thru) : "—"));
                tr.appendChild(el("td", null, s.thru ? String(s.total) : "—"));
                const tp = el("td", "tp " + (s.thru ? relClass(s.toPar) : ""), s.thru ? fmtToPar(s.toPar) : "—");
                tr.appendChild(tp); tb.appendChild(tr);
            });
            table.appendChild(tb); body.appendChild(table);
        }

        // ---- bottom-sheet helper ----
        function sheet(title, build) {
            closeSheet();
            const ov = el("div", "overlay"); ov.id = "lbSheet";
            const sh = el("div", "sheet");
            sh.appendChild(el("div", "grab"));
            sh.appendChild(el("h2", "section", title));
            const body = el("div"); sh.appendChild(body);
            const close = el("button", "btn secondary", "Close"); close.style.marginTop = "1rem"; close.addEventListener("click", closeSheet); sh.appendChild(close);
            ov.appendChild(sh);
            ov.addEventListener("click", function (e) { if (e.target === ov) closeSheet(); });
            document.body.appendChild(ov);
            build(body);
        }
        function closeSheet() { const ov = document.getElementById("lbSheet"); if (ov) ov.remove(); }
        // In-app dialogs (replace native prompt/confirm) — themed, focus-managed, XSS-safe.
        function promptSheet(title, label, placeholder, okText, onOk) {
            sheet(title, function (body) {
                body.appendChild(el("label", "lbl", label));
                const inp = el("input", "field"); inp.placeholder = placeholder || ""; inp.maxLength = 60; body.appendChild(inp);
                const ok = el("button", "btn", okText || "Add"); ok.style.marginTop = "0.85rem";
                ok.addEventListener("click", function () { const v = inp.value.trim(); if (!v) { inp.focus(); return; } closeSheet(); onOk(v); });
                inp.addEventListener("keydown", function (e) { if (e.key === "Enter") ok.click(); });
                body.appendChild(ok);
                setTimeout(function () { inp.focus(); }, 60); // focus the input when the sheet opens
            });
        }
        function confirmSheet(title, message, okText, onOk) {
            sheet(title, function (body) {
                body.appendChild(el("p", "muted", message));
                const ok = el("button", "btn ghost", okText); ok.style.marginTop = "0.9rem";
                ok.addEventListener("click", function () { closeSheet(); onOk(); });
                body.appendChild(ok);
                setTimeout(function () { ok.focus(); }, 60);
            });
        }

        // ============ boot ============
        (async function boot() {
            showBoot();
            if (!token()) return renderLogin();
            const me = await api("/me");
            if (me.status === 401) { sessionStorage.removeItem(TOKEN_KEY); return renderLogin(); }
            if (me.data && me.data.mustChangePin) return renderLogin("Set your own PIN on the Members page first, then come back to score.");
            // deep link: #event/:id
            const m = (location.hash || "").match(/^#event\/(\d+)/);
            if (m) return openEvent(Number(m[1]), "Live event");
            pickEvent();
        })();
    })();
    </script>
</body>
</html>
