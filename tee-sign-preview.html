<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tee-sign preview · GVDG</title>
<link rel="icon" href="data:," /><!-- suppress the default /favicon.ico request (keeps console clean) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  :root { --tee-sign-bg: var(--bg-secondary); --tee-sign-border: var(--text-primary); }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Archivo', system-ui, -apple-system, sans-serif; margin: 0; }
  .tee-preview { min-height: 100vh; width: min(1100px, 100%); margin: 0 auto; padding: clamp(1rem, 4vw, 2rem); }
  .tee-preview-head { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .tee-preview-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; letter-spacing: 0.05em; color: var(--text-primary); }
  .tee-preview-toggle { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 40px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font: inherit; font-weight: 700; padding: 0.55rem 0.8rem; cursor: pointer; box-shadow: 0 6px 20px var(--card-shadow); }
  .tee-preview-toggle:hover { border-color: var(--primary); }
  .tee-preview-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
  .tee-preview-sample { flex: 0 1 320px; }
  .tee-sign { color: var(--text-primary); }
  .tee-sign-bg { fill: var(--tee-sign-bg); stroke: var(--tee-sign-border); stroke-opacity: 0.5; }
  .tee-sign-hole { font: 700 44px 'Bebas Neue', system-ui, sans-serif; fill: currentColor; }
  .tee-sign-course { font: 600 14px system-ui, sans-serif; fill: currentColor; opacity: 0.7; }
  .tee-sign-rule { stroke: currentColor; stroke-opacity: 0.2; }
  .tee-sign-label { font: 600 14px system-ui, sans-serif; fill: currentColor; }
  .tee-sign-par { font: 600 14px system-ui, sans-serif; fill: currentColor; }
  .tee-sign-dist { font: 600 14px system-ui, sans-serif; fill: currentColor; opacity: 0.8; }
  @media (max-width: 420px) { .tee-preview-sample, .tee-sign { width: 100%; height: auto; } }
</style>
<script type="module" src="tee-sign-preview-app/tee-sign-preview-app.js"></script>
</head>
<body>
<div id="teeSignPreviewReactApp"></div>
</body>
</html>
